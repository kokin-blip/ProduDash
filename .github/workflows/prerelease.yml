name: Internal desktop prerelease

on:
  workflow_dispatch:
    inputs:
      signing_mode:
        description: Build signing mode
        required: true
        default: unsigned
        type: choice
        options:
          - unsigned
          - signed
      targets:
        description: Platforms to package
        required: true
        default: all
        type: choice
        options:
          - all
          - mac-arm64
          - mac-x64
          - win-x64

permissions:
  contents: read

jobs:
  plan:
    name: Select targets
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - id: select
        shell: bash
        env:
          REQUESTED_TARGETS: ${{ inputs.targets }}
        run: |
          set -euo pipefail
          all='[
            {"key":"mac-arm64","label":"macOS arm64","os":"macos-14","target":"mac","arch":"arm64"},
            {"key":"mac-x64","label":"macOS x64","os":"macos-15-intel","target":"mac","arch":"x64"},
            {"key":"win-x64","label":"Windows x64","os":"windows-latest","target":"win","arch":"x64"}
          ]'
          if [ "$REQUESTED_TARGETS" = "all" ]; then
            selected=$(jq -c '.' <<<"$all")
          else
            selected=$(jq -c --arg key "$REQUESTED_TARGETS" '[.[] | select(.key == $key)]' <<<"$all")
          fi
          if [ "$(jq 'length' <<<"$selected")" -eq 0 ]; then
            echo "No packaging targets matched the request." >&2
            exit 1
          fi
          echo "matrix=$selected" >> "$GITHUB_OUTPUT"

  package:
    name: Package ${{ matrix.label }}
    needs: plan
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      PRODUDASH_SIGNING_MODE: ${{ inputs.signing_mode }}
      CSC_LINK: ${{ matrix.target == 'mac' && secrets.MAC_CSC_LINK || secrets.WIN_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ matrix.target == 'mac' && secrets.MAC_CSC_KEY_PASSWORD || secrets.WIN_CSC_KEY_PASSWORD }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: matrix.target == 'mac' && inputs.signing_mode == 'signed'
        name: Prepare Apple notarization key
        shell: bash
        env:
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
        run: |
          set -euo pipefail
          test -n "$APPLE_API_KEY_CONTENT"
          printf '%s' "$APPLE_API_KEY_CONTENT" > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"
          echo "APPLE_API_KEY=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run validate
      - run: npm audit --omit=dev
      - run: npm run check:distribution
      - run: npm run package:${{ matrix.target }}
      - run: npm run verify:artifacts
      - run: npm run verify:signatures
      - uses: actions/upload-artifact@v4
        with:
          name: ProduDash-0.1.0-alpha.1-${{ matrix.target }}-${{ matrix.arch }}-${{ inputs.signing_mode }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*-checksums.txt
            dist/*-sbom.cdx.json
            dist/*-build-metadata.json
          if-no-files-found: error
          retention-days: 14
