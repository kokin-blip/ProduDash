name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:syntax
      - run: npm run lint
      - run: npm run format:check
      # Part of `npm run validate` but previously in no CI job at all, so a
      # broken packaging config only surfaced during a manual prerelease run.
      - run: npm run check:package-config
      # Scoped to production dependencies on purpose: the build toolchain
      # carries advisories that cannot be resolved without downgrading
      # electron-builder several major versions. See docs/release-readiness.md.
      - run: npm audit --omit=dev

  desktop:
    name: Desktop validation (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        # The OS families we ship, not every shipped target. There is no linux
        # block in electron-builder.config.cjs and no vendor/media/linux-*
        # bundle, so a Linux runner was validating a platform we never ship.
        #
        # Deliberately still uncovered: prerelease.yml packages mac-x64 on
        # macos-15-intel, and no CI leg runs there -- an Intel-only failure
        # surfaces during a manual prerelease, not here. Dropping Linux also
        # gave up the only case-sensitive filesystem in CI and the only
        # executor of the no-keyring path at credential-vault.cjs:209.
        os:
          - macos-14
          - windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:media
      - run: npm test
      # No xvfb branch: both remaining runners have a real display server.
      - run: npm run test:smoke
      # Storage quota problems must not mask passing tests.
      - if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ runner.os }}-${{ runner.arch }}
          path: test-results/smoke
          if-no-files-found: ignore
          retention-days: 14
