name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:syntax
      - run: npm run lint
      - run: npm run format:check
      - run: npm audit --omit=dev

  desktop:
    name: Desktop validation (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-14
          - windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:media
      - run: npm test
      - if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm run test:smoke
      - if: runner.os != 'Linux'
        run: npm run test:smoke
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ runner.os }}-${{ runner.arch }}
          path: test-results/smoke
          if-no-files-found: ignore
          retention-days: 14
