<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: produdash-media:; media-src 'self' produdash-media:; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'self'"
    />
    <title>ProduDash</title>
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <div class="window-chrome" aria-hidden="true">
      <strong>ProduDash</strong>
    </div>
    <div class="shell">
      <aside class="sidebar" aria-label="Main navigation">
        <div class="brand">
          <div class="brand-mark">
            <svg class="brand-logo" viewBox="0 0 32 32" aria-hidden="true">
              <rect class="logo-frame" x="2.75" y="2.75" width="26.5" height="26.5" rx="8" />
              <path class="logo-d" d="M14.5 8.5h2c4.6 0 7.5 2.9 7.5 7.5s-2.9 7.5-7.5 7.5h-2" />
              <path class="logo-p" d="M9 23.5v-15h6.5c3.5 0 5.7 1.8 5.7 4.8s-2.2 4.8-5.7 4.8H9" />
              <circle class="logo-node" cx="9" cy="23.5" r="1.4" />
            </svg>
          </div>
          <div>
            <strong>ProduDash</strong>
            <span>Operations workspace</span>
          </div>
        </div>

        <nav class="nav-list" aria-label="Dashboard sections" data-active-section="overview">
          <span class="nav-active-indicator" aria-hidden="true"></span>
          <button class="nav-item active" type="button" data-section="overview">
            <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 4h6v6H4zM14 4h6v10h-6zM4 14h6v6H4zM14 18h6v2h-6z" />
            </svg>
            <span>Dashboard</span>
          </button>
          <button class="nav-item" type="button" data-section="inbox">
            <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 5h16v12H8l-4 3V5Zm4 5h8M8 13h5" />
            </svg>
            <span>AI Inbox</span>
          </button>
          <button class="nav-item" type="button" data-section="orders">
            <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M6 3h12v18l-3-2-3 2-3-2-3 2V3Zm3 5h6M9 12h6M9 16h4" />
            </svg>
            <span>Orders</span>
          </button>
          <button class="nav-item" type="button" data-section="signals">
            <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 3v3M5.6 5.6l2.1 2.1M3 12h3M18 12h3M7 17h10M9 21h6M9 12a3 3 0 1 1 6 0c0 2-1 3-2 5h-2c-1-2-2-3-2-5Z" />
            </svg>
            <span>Signals</span>
          </button>
          <button class="nav-item" type="button" data-section="studio">
            <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="m14 4 6 6L9 21H3v-6L14 4Zm-8 9 5 5M13 5l6 6" />
            </svg>
            <span>Content Studio</span>
          </button>
          <button class="nav-item" type="button" data-section="analytics">
            <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 20V10M10 20V4M16 20v-7M22 20H2" />
            </svg>
            <span>Analytics</span>
          </button>
          <button class="nav-item" type="button" data-section="integrations">
            <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M8 12h8M9 7V4M15 7V4M9 20v-3M15 20v-3M7 7h10v10H7z" />
            </svg>
            <span>Integrations</span>
          </button>
        </nav>

        <div class="sidebar-footer">
          <span class="status-dot" aria-hidden="true"></span>
          <div>
            <strong>Connections required</strong>
            <span>Official APIs only</span>
          </div>
        </div>
      </aside>

      <main class="workspace">
        <header class="topbar">
          <div class="page-heading">
            <p class="eyebrow" id="pageEyebrow">Dashboard</p>
            <h1 id="pageTitle" tabindex="-1">Set up ProduDash</h1>
            <p class="page-subtitle" id="pageSubtitle">Connect your store and AI assistant to begin.</p>
          </div>
          <div class="topbar-actions">
            <button class="ghost-button" type="button" id="syncButton" data-pending-label="Refreshing…">Refresh connections</button>
            <button class="primary-button" type="button" id="trainButton">Connect Shopify</button>
          </div>
        </header>

        <section class="business-strip" aria-label="Businesses" id="businessStrip"></section>
        <section id="viewRoot" aria-live="polite"></section>
      </main>
    </div>

    <script type="module" src="./src/app.js"></script>
  </body>
</html>
